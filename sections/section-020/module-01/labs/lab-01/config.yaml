# Find Every Entry Signed By A Leaked Key
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-121-lab-020-01"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-rekor"
      description: "Installs Helm 3.22.1, the CoreDNS rewrite, the workstation pod and a private Rekor v1 (chart 1.8.7), and writes the lab trust files"
      type: "file"
      source: "bootstrap/01-install-rekor.sh"
    - name: "ats-121-lab-020-01-setup"
      description: "Creates the starting state the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The workstation pod with cosign, rekor-cli and regctl (namespace workstation)."
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-rekor"
      description: "Waits until the workstation reaches Rekor and the trust files exist"
      type: "file"
      source: "testing/wait-for-rekor.sh"
    - name: "reference-solution"
      description: "The work a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-leaked-key-entries"
      description: "Confirms uuids lists exactly the entries signed by the leaked ci-old key"
      type: "file"
      source: "validation/validate-leaked-key-entries.sh"
    - name: "validate-unexpected-artifact"
      description: "Confirms unexpected-sha256 is the hash of the ci-old artifact that is not in the release manifest"
      type: "file"
      source: "validation/validate-unexpected-artifact.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - alpine:3.22

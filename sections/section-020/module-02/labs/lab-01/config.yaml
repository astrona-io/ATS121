# Detect New Entries By A Watched Key
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-121-lab-020-02"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-rekor"
      description: "Installs Helm 3.22.1, the CoreDNS rewrite, the workstation pod and a private Rekor v1 (chart 1.8.7), and writes the lab trust files"
      type: "file"
      source: "bootstrap/01-install-rekor.sh"
    - name: "ats-121-lab-020-02-setup"
      description: "Creates the starting state the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The workstation pod with cosign, rekor-cli and regctl (namespace workstation)."
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-rekor"
      description: "Waits until the workstation reaches Rekor and the trust files exist"
      type: "file"
      source: "testing/wait-for-rekor.sh"
    - name: "reference-solution"
      description: "The work a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-new-entry-count"
      description: "Confirms new-entries is the number of entries the log gained since the saved state"
      type: "file"
      source: "validation/validate-new-entry-count.sh"
    - name: "validate-unapproved-entries"
      description: "Confirms unapproved-uuids lists exactly the new team-a entries whose hash is not approved"
      type: "file"
      source: "validation/validate-unapproved-entries.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - alpine:3.22

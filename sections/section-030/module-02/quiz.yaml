# Knowledge check for module 030-02.
schema_version: 1
kind: question_bank
id: ats121-030-02
course_id: ATS121
exam_code: SIGSTORE
status: draft
provenance: "Original practice material written for this course; not official exam questions."
scope:
  type: module
  id: module-030-02
  title: "Attestations In The Log"
placement:
  position: after
  reading: sections/section-030/module-02/course-05-summary.md
questions:
- id: ats121-030-02-q01
  type: single_choice
  difficulty: beginner
  learning_objective: "Name the statement fields"
  source_readings:
  - sections/section-030/module-02/course-01-attestations-and-the-dsse-envelope.md
  prompt: "Which fields does an in-toto statement have?"
  options:
  - id: a
    text: "payloadType, payload and signatures"
    explanation: "Not correct. Those are the fields of the DSSE envelope."
  - id: b
    text: "kind, apiVersion and spec"
    explanation: "Not correct. Those are the fields of a Rekor entry body."
  - id: c
    text: "subject, predicateType and predicate, with a statement type"
    explanation: "Correct. The subject names the artifact and its digest."
  - id: d
    text: "logIndex, treeSize and rootHash"
    explanation: "Not correct. Those describe a log state."
  correct_option: c
  explanation: "Correct. The subject names the artifact and its digest."
- id: ats121-030-02-q02
  type: single_choice
  difficulty: intermediate
  learning_objective: "Describe the envelope"
  source_readings:
  - sections/section-030/module-02/course-01-attestations-and-the-dsse-envelope.md
  prompt: "What does a DSSE signature cover?"
  options:
  - id: a
    text: "Only the payload"
    explanation: "Not correct. The type is covered too."
  - id: b
    text: "Only the payload type"
    explanation: "Not correct. The payload is covered too."
  - id: c
    text: "The Rekor checkpoint"
    explanation: "Not correct. The checkpoint is signed by the log."
  - id: d
    text: "The pre-authentication encoding of the payload type and the payload"
    explanation: "Correct. That ties the signature to the label as well as the bytes."
  correct_option: d
  explanation: "Correct. That ties the signature to the label as well as the bytes."
- id: ats121-030-02-q03
  type: single_choice
  difficulty: intermediate
  learning_objective: "Know what the predicate type is"
  source_readings:
  - sections/section-030/module-02/course-01-attestations-and-the-dsse-envelope.md
  prompt: "Who enforces the predicate type of an attestation?"
  options:
  - id: a
    text: "The verifier, by asking for the type it expects"
    explanation: "Correct. The type is a label the verifier checks."
  - id: b
    text: "Sigstore, on every upload"
    explanation: "Not correct. Sigstore does not judge the claim."
  - id: c
    text: "Rekor, when it adds the entry"
    explanation: "Not correct. Rekor checks the signature, not the meaning."
  - id: d
    text: "The signer, after the fact"
    explanation: "Not correct. The signer cannot enforce what a consumer accepts."
  correct_option: a
  explanation: "Correct. The type is a label the verifier checks."
- id: ats121-030-02-q04
  type: single_choice
  difficulty: beginner
  learning_objective: "Use attest-blob"
  source_readings:
  - sections/section-030/module-02/course-02-logging-an-attestation.md
  prompt: "Which command signs a predicate about a file and uploads an entry to the log?"
  options:
  - id: a
    text: "cosign sign-blob"
    explanation: "Not correct. That signs a file, not a claim about it."
  - id: b
    text: "cosign attest-blob"
    explanation: "Correct. It builds the statement, signs it and writes a bundle."
  - id: c
    text: "rekor-cli get"
    explanation: "Not correct. That reads an entry."
  - id: d
    text: "cosign verify-blob"
    explanation: "Not correct. That verifies a bundle."
  correct_option: b
  explanation: "Correct. It builds the statement, signs it and writes a bundle."
- id: ats121-030-02-q05
  type: single_choice
  difficulty: intermediate
  learning_objective: "Find the field of an attestation bundle"
  source_readings:
  - sections/section-030/module-02/course-02-logging-an-attestation.md
  prompt: "Which bundle field holds the envelope of an attestation, where a plain signature has messageSignature?"
  options:
  - id: a
    text: "inclusionProof"
    explanation: "Not correct. That holds proof hashes."
  - id: b
    text: "kindVersion"
    explanation: "Not correct. That names the entry kind."
  - id: c
    text: "dsseEnvelope"
    explanation: "Correct. The payload and signatures are inside it."
  - id: d
    text: "timestampVerificationData"
    explanation: "Not correct. That holds timestamps."
  correct_option: c
  explanation: "Correct. The payload and signatures are inside it."
- id: ats121-030-02-q06
  type: single_choice
  difficulty: intermediate
  learning_objective: "Read the entry kind"
  source_readings:
  - sections/section-030/module-02/course-02-logging-an-attestation.md
  prompt: "How do you find the kind of the Rekor entry for an attestation?"
  options:
  - id: a
    text: "Assume it is hashedrekord"
    explanation: "Not correct. hashedrekord is for plain signatures."
  - id: b
    text: "Assume it from the cosign version"
    explanation: "Not correct. Tool versions can change the answer."
  - id: c
    text: "Guess from the log index"
    explanation: "Not correct. The index says nothing about the kind."
  - id: d
    text: "Read kindVersion in the bundle and the kind in the entry body"
    explanation: "Correct. The kind depends on the tools, so read it."
  correct_option: d
  explanation: "Correct. The kind depends on the tools, so read it."
- id: ats121-030-02-q07
  type: single_choice
  difficulty: intermediate
  learning_objective: "Verify an attestation"
  source_readings:
  - sections/section-030/module-02/course-03-verifying-an-attestation.md
  prompt: "What does cosign verify-blob-attestation check beyond verify-blob?"
  options:
  - id: a
    text: "That the subject digest matches the file and the predicate type matches --type"
    explanation: "Correct. These two checks tie the statement to the file and the kind of claim."
  - id: b
    text: "That the claim in the predicate is true"
    explanation: "Not correct. A pass does not prove the claim is true."
  - id: c
    text: "That the artifact has no vulnerabilities"
    explanation: "Not correct. The tool does not scan."
  - id: d
    text: "That the key is in the public-good root"
    explanation: "Not correct. The trusted root decides which keys count."
  correct_option: a
  explanation: "Correct. These two checks tie the statement to the file and the kind of claim."
- id: ats121-030-02-q08
  type: single_choice
  difficulty: intermediate
  learning_objective: "Read a failed verification"
  source_readings:
  - sections/section-030/module-02/course-03-verifying-an-attestation.md
  prompt: "You verify a valid bundle but ask for a different predicate type. What happens?"
  options:
  - id: a
    text: "It passes, because the signature is valid"
    explanation: "Not correct. The type is part of the check."
  - id: b
    text: "The verification fails with a predicate type mismatch"
    explanation: "Correct. A claim of one kind must not stand in for another."
  - id: c
    text: "It passes with a warning"
    explanation: "Not correct. There is no warning mode."
  - id: d
    text: "It asks Rekor for another entry"
    explanation: "Not correct. Verification is offline."
  correct_option: b
  explanation: "Correct. A claim of one kind must not stand in for another."
- id: ats121-030-02-q09
  type: single_choice
  difficulty: intermediate
  learning_objective: "Audit by kind"
  source_readings:
  - sections/section-030/module-02/course-04-auditing-attestations-in-the-log.md
  prompt: "What should you read first when you audit the entries of a key?"
  options:
  - id: a
    text: "The artifact file"
    explanation: "Not correct. The log does not hold the file."
  - id: b
    text: "The tree size"
    explanation: "Not correct. That does not describe one entry."
  - id: c
    text: "The kind of each entry body"
    explanation: "Correct. The fields of a body depend on its kind."
  - id: d
    text: "The checkpoint origin"
    explanation: "Not correct. That does not help to parse a body."
  correct_option: c
  explanation: "Correct. The fields of a body depend on its kind."
- id: ats121-030-02-q10
  type: single_choice
  difficulty: advanced
  learning_objective: "Tie an entry to a bundle"
  source_readings:
  - sections/section-030/module-02/course-04-auditing-attestations-in-the-log.md
  prompt: "How do you show that a dsse entry records the payload in your bundle?"
  options:
  - id: a
    text: "Compare the log indexes of two bundles"
    explanation: "Not correct. That does not link the content."
  - id: b
    text: "Compare the file size"
    explanation: "Not correct. Size proves nothing."
  - id: c
    text: "Compare the SHA-256 hash of the decoded payload with the payload hash in the entry"
    explanation: "Correct. The entry holds hashes, not the statement."
  - id: d
    text: "Search the log for the predicate text"
    explanation: "Not correct. The log does not hold the predicate text."
  correct_option: c
  explanation: "Correct. The entry holds hashes, not the statement."

# Final domain knowledge check across all three sections.
schema_version: 1
kind: question_bank
id: ats121-final
course_id: ATS121
exam_code: SIGSTORE
status: draft
provenance: Original practice material written for this course; not official exam
  questions.
scope:
  type: domain
  id: rekor-transparency-log
  title: Immutable Auditing With The Rekor Transparency Log
questions:
- id: ats121-final-q01
  type: single_choice
  difficulty: beginner
  learning_objective: Explain what an append-only log guarantees
  source_readings:
  - sections/section-010/module-01/course-01-why-transparency-logs.md
  prompt: What does it mean that a transparency log is append-only?
  options:
  - id: a
    text: New entries go at the end, and existing entries are never edited or deleted.
    explanation: Correct. Append-only means entries are only added at the end.
  - id: b
    text: Each entry can be edited once by the key owner.
    explanation: Not correct. No one can edit an entry, including the key owner.
  - id: c
    text: Old entries are deleted after a set time.
    explanation: Not correct. Entries are never deleted.
  - id: d
    text: Only the log operator can read the entries.
    explanation: Not correct. The log is public and anyone can read it.
  correct_option: a
  explanation: Correct. Append-only means entries are only added at the end.
- id: ats121-final-q02
  type: single_choice
  difficulty: intermediate
  learning_objective: Follow an inclusion proof
  source_readings:
  - sections/section-010/module-01/course-02-merkle-trees-and-inclusion-proofs.md
  prompt: In a tree of four entries, which hashes does the log send to prove that
    e2 is in the tree?
  options:
  - id: a
    text: L2 and N23
    explanation: Not correct. These are the hashes the verifier computes itself, not
      siblings.
  - id: b
    text: L0 and L1
    explanation: Not correct. Only the sibling N01 is needed, not its two leaves.
  - id: c
    text: L3 and N01
    explanation: Correct. L3 is the sibling of L2, and N01 is the sibling of N23.
  - id: d
    text: Only the root hash R
    explanation: Not correct. The root alone does not let the verifier recompute anything.
  correct_option: c
  explanation: Correct. L3 is the sibling of L2, and N01 is the sibling of N23.
- id: ats121-final-q03
  type: single_choice
  difficulty: advanced
  learning_objective: Read the root hash of an older tree size
  source_readings:
  - sections/section-010/module-01/course-03-consistency-proofs-and-checkpoints.md
  prompt: You saved the root hash of the log at tree size 10. Where do you find the
    root hash the log signed for size 10?
  options:
  - id: a
    text: In the `rootHash` field of a consistency proof answer that ends at size
      10.
    explanation: Not correct. That field always holds the root of the current tree.
  - id: b
    text: In the output of `rekor-cli loginfo` today.
    explanation: Not correct. It shows today's root, not the root at size 10.
  - id: c
    text: In the UUID of the tenth entry.
    explanation: Not correct. The UUID is a leaf hash.
  - id: d
    text: In a checkpoint for that size, for example in a Sigstore bundle.
    explanation: Correct. A checkpoint signs the root hash at its own tree size.
  correct_option: d
  explanation: Correct. A checkpoint signs the root hash at its own tree size.
- id: ats121-final-q04
  type: single_choice
  difficulty: beginner
  learning_objective: Search by a hash from a release page
  source_readings:
  - sections/section-020/module-01/course-01-searching-the-log.md
  prompt: You have only a SHA-256 hash from a release page. Which command finds the
    entries for it?
  options:
  - id: a
    text: "`rekor-cli search --artifact <hex>`"
    explanation: Not correct. The flag `--artifact` takes a file, not a hash.
  - id: b
    text: "`rekor-cli search --sha <hex>`"
    explanation: Correct. The flag `--sha` takes a hash value.
  - id: c
    text: "`rekor-cli get --log-index <hex>`"
    explanation: Not correct. The log index is a position number.
  - id: d
    text: "`rekor-cli verify --uuid <hex>`"
    explanation: Not correct. A file hash is not an entry UUID, and verify does not
      search.
  correct_option: b
  explanation: Correct. The flag `--sha` takes a hash value.
- id: ats121-final-q05
  type: single_choice
  difficulty: intermediate
  learning_objective: Interpret an empty search
  source_readings:
  - sections/section-020/module-01/course-01-searching-the-log.md
  prompt: A search for a public key on your Rekor server returns no entries. What
    does that prove?
  options:
  - id: a
    text: That the key never signed anything anywhere.
    explanation: Not correct. The key could have signed to another log or not logged
      at all.
  - id: b
    text: That the key is revoked.
    explanation: Not correct. Search does not check revocation.
  - id: c
    text: That the log lost the entries.
    explanation: Not correct. The index simply has no matching key.
  - id: d
    text: Only that this log's index has no such key. Signatures sent to another log
      do not show up.
    explanation: Correct. An empty answer is limited to this log.
  correct_option: d
  explanation: Correct. An empty answer is limited to this log.
- id: ats121-final-q06
  type: single_choice
  difficulty: advanced
  learning_objective: Audit one key against a release manifest
  source_readings:
  - sections/section-020/module-01/course-02-reading-and-auditing-entries.md
  prompt: During an audit of one key, an entry has an artifact hash that is not in
    the release manifest. What do you do?
  options:
  - id: a
    text: 'Treat it as a lead: keep the entry ID and log index as evidence and check
      build logs and registries.'
    explanation: Correct. It is an unexpected signing event, not yet proof of an attack.
  - id: b
    text: Delete the entry from the log.
    explanation: Not correct. No one can delete entries from the log.
  - id: c
    text: Ignore it, because the signature is valid.
    explanation: Not correct. A valid signature can still come from a stolen key.
  - id: d
    text: Declare an attack at once.
    explanation: Not correct. It is a lead until you check other sources.
  correct_option: a
  explanation: Correct. It is an unexpected signing event, not yet proof of an attack.
- id: ats121-final-q07
  type: single_choice
  difficulty: intermediate
  learning_objective: Avoid the public-good instance
  source_readings:
  - sections/section-030/module-01/course-01-the-sigstore-bundle.md
  prompt: You run `cosign sign-blob` with cosign v3 and leave out `--signing-config`.
    Where does the entry go?
  options:
  - id: a
    text: To the private Rekor named by `REKOR_REKOR_SERVER`.
    explanation: Not correct. That variable is for `rekor-cli`, not for cosign signing.
  - id: b
    text: Nowhere, cosign skips the log.
    explanation: Not correct. cosign v3 still logs, to the public log.
  - id: c
    text: To the public-good Rekor instance.
    explanation: Correct. The default is the public log, which keeps the entry for
      ever.
  - id: d
    text: To a local file only.
    explanation: Not correct. The log entry is uploaded.
  correct_option: c
  explanation: Correct. The default is the public log, which keeps the entry for ever.
- id: ats121-final-q08
  type: single_choice
  difficulty: intermediate
  learning_objective: Read the error of a changed proof
  source_readings:
  - sections/section-030/module-01/course-02-offline-verification.md
  prompt: You change one sibling hash in the inclusion proof of a bundle and leave
    the artifact alone. What happens?
  options:
  - id: a
    text: Verification fails with an error about the log evidence, because the hashes
      no longer lead to the signed root.
    explanation: Correct. The checkpoint signature no longer fits.
  - id: b
    text: Verification passes, because the signature is still correct.
    explanation: Not correct. The proof is checked too.
  - id: c
    text: Verification fails with a signature error.
    explanation: Not correct. The signature is fine. The log evidence fails.
  - id: d
    text: cosign fetches a new proof from Rekor.
    explanation: Not correct. Offline verification never asks the log.
  correct_option: a
  explanation: Correct. The checkpoint signature no longer fits.
- id: ats121-final-q09
  type: single_choice
  difficulty: intermediate
  learning_objective: Plan evidence for Rekor v2
  source_readings:
  - sections/section-030/module-01/course-03-rekor-v2.md
  prompt: Rekor v2 has no search index. What should a team do?
  options:
  - id: a
    text: Search by hash later, as with Rekor v1.
    explanation: Not correct. Rekor v2 cannot be searched.
  - id: b
    text: Keep a bundle for every artifact it releases.
    explanation: Correct. In Rekor v2 the bundle is the evidence.
  - id: c
    text: Keep only the detached signatures.
    explanation: Not correct. They hold no log evidence.
  - id: d
    text: Use `--insecure-ignore-tlog` when verifying.
    explanation: Not correct. That skips the log checks.
  correct_option: b
  explanation: Correct. In Rekor v2 the bundle is the evidence.

# Upload A Signature To The Log
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-121-lab-010-02"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-rekor"
      description: "Installs Helm 3.22.1, the CoreDNS rewrite, the workstation pod and a private Rekor v1 (chart 1.8.7), and writes the lab trust files"
      type: "file"
      source: "bootstrap/01-install-rekor.sh"
    - name: "ats-121-lab-010-02-setup"
      description: "Creates the starting state the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The workstation pod with cosign, rekor-cli and regctl (namespace workstation)."
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-rekor"
      description: "Waits until the workstation reaches Rekor and the trust files exist"
      type: "file"
      source: "testing/wait-for-rekor.sh"
    - name: "reference-solution"
      description: "The work a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-entry-uploaded"
      description: "Confirms the security notice has an entry in Rekor with a verifying inclusion proof"
      type: "file"
      source: "validation/validate-entry-uploaded.sh"
    - name: "validate-entry-signed-by-notice-key"
      description: "Confirms the notice entry was made with the notice key"
      type: "file"
      source: "validation/validate-entry-signed-by-notice-key.sh"
    - name: "validate-answer-recorded"
      description: "Confirms notice-entry holds the log index and UUID of the notice entry"
      type: "file"
      source: "validation/validate-answer-recorded.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - alpine:3.22
